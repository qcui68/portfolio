<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Creative Corner — Quinie Cui</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #efeee8;
      --navy:      #2E4256;
      --navy-soft: #3D4F68;
      --muted:     #6B7280;
      --accent:    #C8B89A;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--navy);
      font-family: 'Averia Serif Libre', serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav (same as other pages) ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 28px 260px;
      gap: 30px;
    }

    nav .nav-links {
      display: flex;
      gap: 35px;
      list-style: none;
    }

    nav .nav-links a {
      text-decoration: none;
      color: var(--navy);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: opacity 0.2s;
    }

    nav .nav-links a:hover { opacity: 0.55; }

    nav .nav-links a.active {
      border-bottom: 2px solid var(--navy);
      padding-bottom: 2px;
    }

    nav .nav-icons {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    nav .nav-icons a {
      color: var(--navy);
      opacity: 0.75;
      transition: opacity 0.2s;
    }

    nav .nav-icons a:hover { opacity: 1; }
    nav .nav-icons svg { width: 22px; height: 22px; }

    /* ── Hero: the desk is zoomed in edge to edge, with the heading on the wall ── */
    .desk-hero {
      position: relative;
      width: 100%;
      max-width: 2000px;
      margin: 0 auto;
      container-type: inline-size;
    }

    .desk-heading {
      position: absolute;
      z-index: 3;
      left: max(260px, calc(50% - 540px));
      top: calc(40px + 2cqw);
      pointer-events: none;
    }

    .desk-heading h1 {
      font-family: 'Pangolin', cursive;
      font-size: clamp(36px, 4vw, 52px);
      font-weight: 400;
      color: var(--navy);
    }

    .desk-heading p {
      font-size: 15px;
      color: var(--navy-soft);
      max-width: min(620px, 42cqw);
      line-height: 1.7;
      margin-top: 12px;
    }

    /* Crops the zoomed desk to the tabletop (the front edge and legs are cut off). */
    .desk-crop {
      position: relative;
      overflow: hidden;
      margin-top: 40px;
      aspect-ratio: 1 / 0.627;
    }

    .desk-scene {
      position: relative;
      width: 103%;
      margin-left: -1.5%;
    }

    .desk-illustration {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Each object on the desk is drawn as its own image placed exactly where
       the original sat (the desk image has it painted out). The link is an
       invisible layer clipped to the object's outline so only the object is
       clickable; the visible image lifts when the link is hovered/focused. */
    .desk-link,
    .desk-item {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      aspect-ratio: var(--ar);
    }

    .desk-link {
      z-index: 2;
      display: block;
      cursor: pointer;
      clip-path: var(--hit);
      outline: none;
    }

    .desk-item {
      z-index: 1;
      height: auto;
      pointer-events: none;
      clip-path: var(--rest-clip, inset(0));
      transform-origin: 50% 90%;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.3, 1),
                  filter 0.25s ease,
                  clip-path 0.25s ease;
    }

    .desk-link:hover + .desk-item,
    .desk-link:focus-visible + .desk-item {
      transform: translateY(-6%) scale(1.07) rotate(-1.5deg);
      filter: drop-shadow(0 10px 8px rgba(46, 66, 86, 0.28));
      clip-path: inset(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .desk-item { transition: none; }
    }

    /* ── Responsive ── */
    @media (max-width: 1439px) {
      .desk-heading {
        position: static;
        padding: 32px 260px 0;
        pointer-events: auto;
      }
      .desk-heading p { max-width: 620px; }
      .desk-crop { margin-top: 24px; }
    }

    @media (max-width: 900px) {
      nav { padding: 20px 24px; }
      .desk-heading { padding: 24px 24px 0; }
    }
  </style>
</head>
