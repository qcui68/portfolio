  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #efeee8;
      --navy:      #2E4256;
      --navy-soft: #3D4F68;
      --muted:     #6B7280;
      --accent:    #C8B89A;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--navy);
      font-family: 'Averia Serif Libre', serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav (same as other pages) ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 28px 260px;
      gap: 30px;
    }

    nav .nav-links {
      display: flex;
      gap: 35px;
      list-style: none;
    }

    nav .nav-links a {
      text-decoration: none;
      color: var(--navy);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: opacity 0.2s;
    }

    nav .nav-links a:hover { opacity: 0.55; }

    nav .nav-links a.active {
      border-bottom: 2px solid var(--navy);
      padding-bottom: 2px;
    }

    nav .nav-icons {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    nav .nav-icons a {
      color: var(--navy);
      opacity: 0.75;
      transition: opacity 0.2s;
    }

    nav .nav-icons a:hover { opacity: 1; }
    nav .nav-icons svg { width: 22px; height: 22px; }

    /* ── Page header ── */
    .page-header {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 48px 260px 32px;
    }

    .page-header h1 {
      font-family: 'Pangolin', cursive;
      font-size: clamp(36px, 4vw, 52px);
      font-weight: 400;
      color: var(--navy);
    }

    /* ── Placeholder content ── */
    .page-body {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 260px 80px;
    }

    .page-body p {
      font-size: 15px;
      color: var(--navy-soft);
      max-width: 620px;
      line-height: 1.7;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      nav { padding: 20px 24px; }
      .page-header { padding: 32px 24px 20px; }
      .page-body { padding: 0 24px 60px; }
    }
  </style>
</head>
